<!doctype html>
<meta charset="utf-8">
<title>Test sign-in</title>
<style>
  body { font: 20px sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; background: #f4f4f4; }
  form, #dashboard { display: grid; gap: 16px; width: 420px; padding: 32px; background: white; border: 1px solid #ccc; }
  input, button { font: inherit; padding: 12px; }
  #error { color: #b00020; min-height: 1.2em; }
  [hidden] { display: none !important; }
</style>
<form id="form">
  <h1>Sign in</h1>
  <label>Email <input id="email" type="email" autocomplete="off" style="width:100%;box-sizing:border-box"></label>
  <label>Password <input id="password" type="password" autocomplete="off" style="width:100%;box-sizing:border-box"></label>
  <button>Sign in</button>
  <div id="error"></div>
</form>
<div id="dashboard" hidden><h1>Dashboard</h1><p>Signed in as tester@keek.example</p></div>
<script>
  const send = (event) => fetch("/log", { method: "POST", body: JSON.stringify({ ...event, t: Date.now() }) });
  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const ok = email.value === "tester@keek.example" && password.value === "made-up-test-password";
    send({ type: "submit", ok });
    if (ok) {
      form.hidden = true;
      dashboard.hidden = false;
    } else {
      error.textContent = "Wrong email or password.";
    }
  });
</script>
