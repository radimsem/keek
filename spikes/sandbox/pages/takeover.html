<!doctype html>
<meta charset="utf-8">
<title>Takeover</title>
<style>
  html, body { margin: 0; height: 100%; font: 18px monospace; background: white; }
  #log { padding: 16px; white-space: pre-wrap; }
</style>
<div id="log">Event log. Empty until input reaches this page.</div>
<input id="field" style="position:fixed;bottom:16px;left:16px;font:inherit;width:60%" placeholder="Type here">
<script>
  const log = document.getElementById("log");
  let lines = 0;
  const record = (type, detail) => {
    if (lines++ === 0) log.textContent = "";
    log.textContent += `${type} ${detail}\n`;
    fetch("/log", { method: "POST", body: JSON.stringify({ type, detail, t: Date.now() }) });
  };
  addEventListener("pointerdown", (event) => record("pointerdown", `${event.clientX},${event.clientY}`));
  addEventListener("keydown", (event) => record("keydown", event.key));

  // The host sets the colour through the session folder, because it can't
  // reach this page's localhost.
  let current = "white";
  setInterval(async () => {
    const colour = (await (await fetch("/state")).text()).trim();
    if (colour === current) return;
    current = colour;
    document.documentElement.style.background = colour;
    document.body.style.background = colour;
    log.style.display = field.style.display = colour === "magenta" ? "none" : "";
    requestAnimationFrame(() => requestAnimationFrame(() => {
      fetch("/log", { method: "POST", body: JSON.stringify({ type: "colour", colour, t: Date.now() }) });
    }));
  }, 10);
</script>
