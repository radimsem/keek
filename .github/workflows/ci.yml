name: CI

on:
  pull_request:
    paths: &paths
      - '**'
      - '!docs/**'
      - '!**.md'
      # tests/mcp_server.rs reads this one.
      - 'docs/design.md'
  push:
    branches: [main]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    # A hung daemon test would otherwise bill until the 6-hour default.
    timeout-minutes: 10
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      # Before the cache, whose key includes the rustc version.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # GitHub keeps a pull request's cache to its own branch, so only main's is reusable.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
