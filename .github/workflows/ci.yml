name: CI

# No paths filter: the gates job is a required check, and a required check that never runs blocks the merge.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    # Ubuntu packages gtk4-layer-shell from 25.04, so 24.04 can't build the viewer.
    runs-on: ubuntu-26.04
    # A hung daemon test would otherwise bill until the 6-hour default.
    timeout-minutes: 10
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - name: Install GTK
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev libgtk4-layer-shell-dev
      # Before the cache, whose key includes the rustc version.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      # GitHub keeps a pull request's cache to its own branch, so only main's is reusable.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check formatting
        run: cargo fmt --check
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --locked
